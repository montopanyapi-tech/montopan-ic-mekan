<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montopan Cephe Visualizer v12.2</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; 
            padding: 0;
            background-color: #0f172a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #f1f5f9;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        #app-wrapper {
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto;
            background: #0f172a; 
            padding: 0;
        }
        #top-control-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; padding: 10px 15px;
            border-radius: 6px; margin-bottom: 6px; border: 1px solid #334155;
            flex-wrap: wrap; gap: 10px;
        }
        .control-group { display: flex; align-items: center; gap: 15px; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: inline-block; padding: 8px 16px; cursor: pointer;
            background: #334155; color: #fff; border: 2px dashed #38bdf8;
            border-radius: 6px; font-weight: 600; font-size: 14px; transition: all 0.2s;
        }
        .custom-file-upload:hover { background: #38bdf8; color: #0f172a; border-style: solid; }
        
        .clear-btn {
            display: inline-block; padding: 8px 16px; cursor: pointer;
            background: #475569; color: #fff; border: 1px solid #64748b;
            border-radius: 6px; font-weight: 600; font-size: 14px; transition: all 0.2s;
        }
        .clear-btn:hover { background: #475569; }

        #file-status { font-size: 13px; color: #94a3b8; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .exit-link {
            display: inline-block; padding: 8px 16px; background: #ef4444; color: white;
            border: none; font-weight: bold; font-size: 14px; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; text-decoration: none;
        }
        .exit-link:hover { background: #b91c1c; }

        /* CANLI SAHNE ALANI */
        #stage-wrapper {
            position: relative;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #0f172a;
        }
        #base-house {
            display: block;
            width: 100%;
            height: auto;
        }

        /* KAPLAMA MASKELERI */
        .wall-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
            mix-blend-mode: multiply;
            opacity: 0.95;
            background-repeat: repeat;
            background-size: 180px auto;
        }

        .wall-main {
            clip-path: polygon(
                20.2% 2.4%, 
                79.3% 2.4%, 
                79.3% 53.6%, 
                20.2% 53.6%
            );
        }

        .molding-shadow {
            position: absolute;
            top: 2.4%; left: 20.2%;
            width: 59.1%; height: 51.2%;
            z-index: 3; pointer-events: none;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.35);
            border: 1px solid rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="top-control-bar">
            <div class="control-group">
                <label for="panelInput" class="custom-file-upload">📁 Panel Seç</label>
                <input type="file" id="panelInput" accept="image/*">
                <button type="button" class="clear-btn" onclick="clearPanel()">❌ Temizle</button>
                <span id="file-status">Panel Seçilmedi</span>
            </div>
            
            <div class="control-group">
                <a href="https://www.montopan.com/ana-sayfa"target="_top" class="exit-link">🚪 Geri Dön</a>
            </div>
        </div>

        <div id="stage-wrapper">
            <img src="room.jpg" id="base-house" alt="Modern Koltuklu Oda">
            <div class="wall-overlay wall-main"></div>
            <div class="molding-shadow"></div>
        </div>
    </div>

<script>
function clearPanel() {
    document.getElementById("panelInput").value = "";
    document.getElementById("file-status").innerText = "Panel Seçilmedi";
    const wallOverlays = document.querySelectorAll(".wall-overlay");
    wallOverlays.forEach(function(wall) {
        wall.style.backgroundImage = "none";
    });
}

document.getElementById("panelInput").addEventListener("change", function(e) {
    if (!e.target.files || e.target.files.length === 0) return;
    
    const file = e.target.files[0];
    document.getElementById("file-status").innerText = file.name;

    const reader = new FileReader();
    reader.onload = function(evt) {
        const wallOverlays = document.querySelectorAll(".wall-overlay");
        wallOverlays.forEach(function(wall) {
            wall.style.backgroundImage = "url('" + evt.target.result + "')";
        });
    };
    reader.readAsDataURL(file);
});
</script>
</body>
</html>
